<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Открой, когда…</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Для тебя">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7c9d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#6b3a4e;--bg1:#fdeef3;--bg2:#f0e7fb;--card:#ffffffb8;--acc:#e0749c;--hand:"Marck Script","Segoe Script","Brush Script MT",cursive}
html[data-t="night"]{--ink:#f7e4ee;--bg1:#241a3a;--bg2:#3a2147;--card:#ffffff18;--acc:#f291b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--hand);font-size:20px;color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html[data-t="night"] body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff9,transparent),radial-gradient(2px 2px at 88% 40%,#fff8,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff8,transparent),radial-gradient(2px 2px at 55% 88%,#fff7,transparent),radial-gradient(1.5px 1.5px at 8% 92%,#fff8,transparent)}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;bottom:-40px;opacity:.4;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
header{position:relative;text-align:center;padding:30px 16px 4px}
h1{margin:0;font-size:clamp(38px,11vw,56px);font-weight:400;line-height:1.05}
header p{margin:6px 0 0;opacity:.75;font-size:22px}
.days{margin:12px auto 0;display:inline-block;padding:6px 18px;border-radius:999px;background:var(--card);font-size:22px}
.tools{position:relative;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 10px 4px}
.btn{font:inherit;font-size:21px;border:0;border-radius:999px;padding:9px 24px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 4px 14px #e0749c55}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;max-width:620px;margin:20px auto 60px;padding:0 18px}
.env{position:relative;aspect-ratio:4/3;cursor:pointer;filter:drop-shadow(0 8px 12px #8a4a6a38);transition:transform .25s;animation:float 6s ease-in-out infinite}
.env:nth-child(2n){animation-delay:-2s}.env:nth-child(3n){animation-delay:-4s}
@keyframes float{50%{transform:translateY(-4px) rotate(.6deg)}}
.env:active{transform:scale(.97)}
.eb{position:absolute;inset:0;border-radius:8px;background:var(--c);overflow:hidden}
.eb::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,#fff6 50%,transparent 51%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49%,#fff6 50%,transparent 51%) right/50% 100% no-repeat}
.eb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,#ffffff14 6px 7px)}
.ef{position:absolute;left:0;right:0;top:0;height:58%;background:var(--c2);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0;transform-origin:top;transition:transform .7s;box-shadow:0 2px 4px #0002}
.ef::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff4,transparent 60%)}
.stamp{position:absolute;right:8px;bottom:8px;width:26px;height:30px;border:2px dashed #fff9;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#ffffff40;transform:rotate(5deg)}
.seal{position:absolute;left:50%;top:58%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a9e,#c42b4c 65%,#8f1a35);box-shadow:0 3px 6px #0005,inset 0 -2px 4px #0004;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}
.lbl{position:absolute;left:8px;right:44px;bottom:7px;font-size:16px;line-height:1.05;color:#5a2e41;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;z-index:2}
.badge{position:absolute;top:-8px;left:-6px;z-index:4;background:#fff;color:#d63a6a;border-radius:999px;padding:1px 10px;font-size:16px;box-shadow:0 2px 6px #0003;transform:rotate(-8deg)}
.lock{position:absolute;inset:0;z-index:3;border-radius:8px;background:#3a2a4acc;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;text-align:center;padding:6px;line-height:1.1}
.lock b{font-size:28px;font-weight:400}
.env.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.env.secret{grid-column:1/-1;aspect-ratio:auto;height:150px;--c:#ffe9a8;--c2:#f9c6d8;animation:glow 2.4s ease-in-out infinite;order:99}
.env.secret .eb{background:linear-gradient(135deg,#ffe9a8,#f9c6d8 55%,#e5d4ff);box-shadow:0 0 0 2px #fff9}
.env.secret .seal{background:radial-gradient(circle at 35% 30%,#ffe58a,#e0a82e 65%,#a87812)}
.env.secret::after{content:"✨";position:absolute;right:-6px;top:-14px;font-size:28px;animation:tw 1.4s infinite;z-index:5}
.env.secret .lbl{font-size:18px;right:50px;-webkit-line-clamp:4}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #ffc94d)}}
@keyframes tw{50%{transform:scale(1.4) rotate(20deg)}}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#2c1426c8;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.stage{position:relative;width:min(300px,80vw);aspect-ratio:3/2;transform:scale(.4);opacity:0;transition:transform .7s,opacity .5s}
.ov.on .stage{transform:scale(1);opacity:1}
.stage.gone{transform:translateY(60vh) scale(.8);opacity:0;transition:all .9s}
.stage .env{height:100%;aspect-ratio:auto;pointer-events:none;animation:none;filter:none}
.stage.open .ef{transform:rotateX(180deg)}
.letter{position:fixed;left:50%;top:50%;width:min(92vw,470px);max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:none;flex-direction:column;background:#fffaf2;color:#5b3347;border-radius:6px;padding:20px 20px 14px;box-shadow:0 20px 60px #0006;transform:translate(-50%,-50%);animation:fly 1s cubic-bezier(.2,.8,.2,1)}
.letter.on{display:flex}
@keyframes fly{from{transform:translate(-50%,20%) scale(.3);opacity:0}}
.letter h2{margin:0 0 6px;font-weight:400;font-size:26px;text-align:center;line-height:1.1}
.scr{overflow-y:auto;flex:1;min-height:0}
.txt{font-size:23px;line-height:30px;white-space:pre-wrap;background:repeating-linear-gradient(transparent 0 29px,#efcfda 29px 30px);padding:0 2px;min-height:120px}
.pics{display:flex;flex-direction:column;gap:20px;margin:22px 0 8px;align-items:center;opacity:0;transition:opacity 1.2s}
.pics.on{opacity:1}
.pics .pol{max-width:94%}
.lb{position:fixed;inset:0;z-index:40;background:#000e;display:none;align-items:center;justify-content:center;padding:10px}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
.txt span{opacity:0;transition:opacity .5s}.txt span.on{opacity:1}
.letter.secret{background:linear-gradient(160deg,#fff7df,#ffe3ee 60%,#efe3ff);box-shadow:0 0 50px #ffd36b,0 20px 60px #0006}
.hug{height:70px;position:relative;font-size:40px;margin-bottom:4px}
.hug span{position:absolute;top:10px;transition:all 1.6s}
.hug .l{left:18%}.hug .r{right:18%}
.hug.on .l{left:calc(50% - 40px)}.hug.on .r{right:calc(50% - 40px)}
.hug .h{left:50%;top:-6px;transform:translateX(-50%) scale(0);opacity:0;font-size:30px}
.hug.on .h{transform:translateX(-50%) scale(1);opacity:1;transition-delay:1.4s}
.foot{text-align:center;margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fall{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg)}}
.gate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(165deg,var(--bg1),var(--bg2));padding:20px;text-align:center}
.gate.on{display:flex}
.gate input{font:inherit;font-size:30px;text-align:center;width:200px;letter-spacing:8px;border:2px solid var(--acc);border-radius:16px;padding:8px;background:var(--card);color:var(--ink)}
.gate small{color:#d63a6a;min-height:24px}
#mus{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:20px}
.err{text-align:center;padding:40px}
#thm{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:19px;cursor:pointer}
.meet{margin:8px auto 0;display:none;padding:5px 16px;border-radius:999px;background:var(--card);font-size:21px}
.nav{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 14px 2px;margin:8px auto 0;max-width:660px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:19px;border:0;border-radius:999px;padding:7px 16px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.view{position:relative;max-width:620px;margin:0 auto;padding:6px 18px 60px}
.view .grid{margin:14px 0 0;padding:0}
.pol{margin:0;background:#fff;padding:8px 8px 24px;box-shadow:0 6px 16px #0003;transform:rotate(var(--r,-2deg));cursor:zoom-in;color:#5b3347}
.pol img{display:block;width:100%;max-height:55vh;object-fit:cover}
.tl{position:relative;margin:16px 0 0 10px;padding-left:22px;border-left:3px dotted var(--acc)}
.tli{position:relative;margin-bottom:22px}
.tli i{position:absolute;left:-31px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--card)}
.tlc{background:var(--card);border-radius:16px;padding:12px 14px}
.tlc small{opacity:.7;font-size:17px}.tlc b{display:block;font-weight:400;font-size:25px;line-height:1.1}.tlc p{margin:6px 0;white-space:pre-wrap}
.tlc .pol{margin-top:10px}
.cp{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--acc);border-radius:16px;padding:14px;margin:14px 0;position:relative}
.cp .e{font-size:38px}.cp b{display:block;font-weight:400;font-size:25px;line-height:1.1}.cp p{margin:2px 0 0;opacity:.8;font-size:18px}
.cp.used{opacity:.5;filter:grayscale(.6)}
.cp.used::after{content:"использовано ✓";position:absolute;right:10px;top:8px;transform:rotate(-8deg);border:2px solid var(--acc);border-radius:6px;padding:0 8px;font-size:16px}
.todo{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer;font-size:21px}
.todo u{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.todo.done u{background:var(--acc);color:#fff}.todo.done span{text-decoration:line-through;opacity:.6}
.prog{height:12px;border-radius:99px;background:var(--card);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--acc);transition:width .6s}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.alb figure{margin:0;cursor:zoom-in}.alb img{width:100%;aspect-ratio:1;object-fit:cover;border:5px solid #fff;box-shadow:0 4px 12px #0003;display:block}
.alb figcaption{text-align:center;font-size:17px;margin-top:4px}
.qz{text-align:center;padding-top:10px}.qz h2{font-weight:400;font-size:30px;line-height:1.15;margin:8px 0 16px}
.opt{display:block;width:100%;font:inherit;font-size:21px;color:var(--ink);background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px;margin:10px 0;cursor:pointer}
.opt.ok{border-color:#4cbf86;background:#4cbf8644}.opt.no{border-color:#e05a6e;background:#e05a6e44}
.song{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
.song div{flex:1;min-width:0}.song b{display:block;font-weight:400;font-size:22px}.song small{opacity:.7;font-size:17px}
.song a{text-decoration:none}
.fb{margin-top:16px;text-align:center;display:none}
.fb .rx button{font-size:30px;background:none;border:0;padding:4px 9px;cursor:pointer;transition:transform .2s}
.fb .rx button.on{transform:scale(1.35)}
.fb textarea{width:100%;font:inherit;font-size:21px;border:1px dashed #d8a8bb;border-radius:12px;padding:8px 10px;background:#ffffff99;color:#5b3347;min-height:76px;margin-top:6px}
.fb small{display:block;margin-top:4px;opacity:.7;font-size:17px;min-height:22px}
.note{text-align:center;font-size:18px;opacity:.7;margin:10px 0 0}
.plr{margin:-4px 0 10px}.plr .ya{display:block;text-align:center;font-size:18px;margin-top:4px;color:var(--ink)}
.hol{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#2c1426e0;color:#fff;text-align:center;padding:24px}
.hol.on{display:flex}.hol h2{font-weight:400;font-size:40px;margin:0}.hol p{font-size:24px;margin:0;max-width:420px;white-space:pre-wrap}
.lb .cap{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:20px}
.letter.wc-sakura{background:radial-gradient(circle at 12% 8%,#ffcfe0 0,transparent 42%),radial-gradient(circle at 92% 92%,#ffe1ee 0,transparent 48%),#fffaf2}
.letter.wc-stars{background:radial-gradient(circle at 85% 10%,#d4cdff 0,transparent 45%),radial-gradient(circle at 8% 90%,#c7ddff 0,transparent 50%),#faf8ff}
.letter.wc-snow{background:radial-gradient(circle at 10% 10%,#dcefff 0,transparent 45%),radial-gradient(circle at 90% 90%,#f0f8ff 0,transparent 50%),#fcfdff}
.letter.wc-sunset{background:radial-gradient(circle at 90% 8%,#ffd2b0 0,transparent 45%),radial-gradient(circle at 8% 92%,#ffc0d4 0,transparent 50%),#fffaf4}
.letter.wc-mint{background:radial-gradient(circle at 10% 10%,#cdf0e2 0,transparent 45%),radial-gradient(circle at 92% 88%,#dff3ff 0,transparent 50%),#fbfffd}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<button id="mus">♪</button><button id="thm">🌓</button>
<header>
  <h1 id="ttl">Открой, когда… 💌</h1>
  <p id="sub"></p>
  <div class="days" id="days" style="display:none"></div><br><div class="meet" id="meet"></div>
</header>
<div class="nav" id="nav"></div>
<div class="tools"><button class="btn" id="today">💌 Письмо дня</button></div>
<div class="view" id="view"></div>
<div class="ov" id="ov"><div class="stage" id="stage"></div><div class="letter" id="letter"></div></div>
<div class="lb" id="lb"><img id="lbi" alt=""><div class="cap" id="lbc"></div></div>
<div class="hol" id="hol"><div style="font-size:70px" id="hE">🎉</div><h2 id="hT"></h2><p id="hX"></p><button class="btn" id="hB">Спасибо 💗</button></div>
<div class="gate" id="gate"><div style="font-size:54px">🔒</div><div style="font-size:26px">Введи наш код</div><input id="pin" type="password" inputmode="numeric" autocomplete="off"><small id="pinerr"></small><button class="btn" id="pinbtn">Войти</button></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ow:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg={},letters=[],timer,reveal;
const h=new Date().getHours();document.documentElement.dataset.t=ls.get('ow_theme')||((h>=7&&h<20)?'day':'night');
$('thm').onclick=()=>{const n=document.documentElement.dataset.t==='night'?'day':'night';document.documentElement.dataset.t=n;ls.set('ow_theme',n)};

const mo=new Date().getMonth(),SEA=(mo===11||mo<2)?['❄️','🤍','✨','❄️','💗']:mo<5?['🌸','🌷','💗','🌸','✨']:mo<8?['✨','💗','🦋','🌼','🤍']:['🍂','🍁','💗','🍂','✨'];
for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=SEA[i%5];
 s.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*16}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*20}s`;$('bg').appendChild(s)}

const unlockAt=l=>l.unlock?new Date(l.unlock+'T00:00:00'):null;
const isLocked=l=>{const d=unlockAt(l);return d&&d>new Date()};
const ruDate=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});

const plural=n=>{const a=n%100,b=n%10;return(a>10&&a<20)?'дней':b===1?'день':(b>1&&b<5)?'дня':'дней'};
const yw=n=>{const a=n%100,b=n%10;return(a>10&&a<20)?'лет':b===1?'год':(b>1&&b<5)?'года':'лет'};
const fmtD=x=>x?new Date(x+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'';
const mdOf=d=>{const p=d.split('-');return(+p[1])+'-'+(+p[2])};
async function boot(){
 try{const r=await fetch('letters.json?'+Date.now(),{cache:'no-store'});const j=await r.json();cfg=j.config||{};letters=j.letters||[]}
 catch(e){$('view').innerHTML='<div class="err">Не получилось загрузить письма 😢<br>Попробуй обновить страницу.</div>';return}
 ['timeline','coupons','checklist','gallery','quiz','playlist','holidays'].forEach(k=>cfg[k]=cfg[k]||[]);
 document.title=cfg.title||'Открой, когда…';$('ttl').textContent=(cfg.title||'Открой, когда…')+' 💌';$('sub').textContent=cfg.subtitle||'';
 if(cfg.startDate){const n=Math.floor((Date.now()-new Date(cfg.startDate+'T00:00:00'))/864e5);if(n>=0){$('days').style.display='inline-block';$('days').textContent='Мы вместе уже '+n+' '+plural(n)+' 💞'}}
 if(cfg.meetDate){const n=Math.ceil((new Date(cfg.meetDate+'T00:00:00')-new Date(new Date().toDateString()))/864e5);if(n>=0){$('meet').style.display='inline-block';$('meet').textContent=n===0?'Сегодня мы увидимся! 🥰':'До встречи: '+n+' '+plural(n)+' ⏳'}}
 if(cfg.music){const a=new Audio(cfg.music);a.loop=true;const m=$('mus');m.style.display='block';m.onclick=()=>{if(a.paused){a.play();m.textContent='⏸'}else{a.pause();m.textContent='♪'}}}
 if(cfg.pinHash&&ls.get('ow_ok')!==cfg.pinHash){$('gate').classList.add('on');return}
 start()}
function start(){nav();show('letters');holiday()}
$('pinbtn').onclick=async()=>{if(await sha($('pin').value.trim())===cfg.pinHash){ls.set('ow_ok',cfg.pinHash);$('gate').classList.remove('on');start()}else{$('pinerr').textContent='Не тот код, попробуй ещё 💭';$('pin').value=''}};
$('pin').onkeydown=e=>{if(e.key==='Enter')$('pinbtn').click()};

let curView='letters';
function nav(){const T=[['letters','💌 Письма'],['story','📖 История',cfg.timeline],['coupons','🎟 Купоны',cfg.coupons],['todo','✅ Мечты',cfg.checklist],['album','🖼 Альбом',cfg.gallery],['quiz','❓ Квиз',cfg.quiz],['music','🎵 Плейлист',cfg.playlist]].filter(t=>!t[2]||t[2].length);
 $('nav').innerHTML='';$('nav').style.display=T.length>1?'flex':'none';
 T.forEach(t=>{const b=document.createElement('button');b.className='chip';b.dataset.k=t[0];b.textContent=t[1];b.onclick=()=>show(t[0]);$('nav').appendChild(b)})}
function show(k){curView=k;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k));$('today').style.display=k==='letters'?'':'none';const v=$('view');v.innerHTML='';V[k](v);bindLb(v)}
function bindLb(r){r.querySelectorAll('img[data-lb]').forEach(im=>im.onclick=()=>{$('lbi').src=im.src;$('lbc').textContent=im.dataset.cap||'';$('lb').classList.add('on')})}
function track(k,l,d){if(!cfg.dbUrl||!cfg.dbKey)return;try{fetch(`${cfg.dbUrl.replace(/\/$/,'')}/log/${cfg.dbKey}/events.json`,{method:'POST',body:JSON.stringify({t:Date.now(),k,l:l?l.id:'',n:l?l.title:'',d:String(d||'').slice(0,1500)}),keepalive:true}).catch(()=>{})}catch(e){}}
const tracking=()=>!!(cfg.dbUrl&&cfg.dbKey);
const FB=`<div class="fb" id="fb"><div class="rx"><button data-e="💗">💗</button><button data-e="😍">😍</button><button data-e="🥹">🥹</button><button data-e="😂">😂</button><button data-e="🫂">🫂</button></div><textarea id="rep" placeholder="Напиши мне ответ…"></textarea><button class="btn" id="repb" style="margin-top:6px">Отправить ответ</button><small id="reps"></small></div>`;
function bindFb(l){const fb=$('fb');if(!fb)return;fb.querySelectorAll('.rx button').forEach(b=>b.onclick=()=>{track('react',l,b.dataset.e);b.classList.add('on');$('reps').textContent='Отправлено '+b.dataset.e});
 $('repb').onclick=()=>{const t=$('rep').value.trim();if(!t)return;track('reply',l,t);$('rep').value='';$('reps').textContent='Ответ отправлен 💌'}}
function ymEmbed(u){u=(u||'').trim();if(!u)return null;const q=u.match(/src=["']([^"']+)["']/);if(q)u=q[1];
 let m;if(/music\.yandex\.[a-z.]+\/iframe\//.test(u))return{src:u,h:/#track/.test(u)?100:450,open:''};
 if(m=u.match(/music\.yandex\.[a-z.]+\/album\/(\d+)\/track\/(\d+)/))return{src:`https://music.yandex.ru/iframe/#track/${m[2]}/${m[1]}`,h:100,open:u};
 if(m=u.match(/music\.yandex\.[a-z.]+\/users\/([^/?#]+)\/playlists\/(\d+)/))return{src:`https://music.yandex.ru/iframe/#playlist/${m[1]}/${m[2]}`,h:450,open:u};
 if(m=u.match(/music\.yandex\.[a-z.]+\/album\/(\d+)/))return{src:`https://music.yandex.ru/iframe/#album/${m[1]}`,h:450,open:u};
 return null}
const V={
 letters(v){v.innerHTML=(tracking()?'<p class="note">Здесь можно отвечать на письма, и я увижу ответ 💗 Я также вижу, какие письма ты открыла.</p>':'')+'<div class="grid" id="grid"></div>';renderLetters()},
 story(v){v.innerHTML='<div class="tl">'+cfg.timeline.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>`<div class="tli"><i></i><div class="tlc"><small>${fmtD(x.date)}</small><b>${esc(x.title||'')}</b><p>${esc(x.text||'')}</p>${x.photo?`<figure class="pol" style="--r:-2deg"><img src="${esc(x.photo)}" loading="lazy" data-lb alt=""></figure>`:''}</div></div>`).join('')+'</div>'},
 coupons(v){const used=ls.get('ow_used')||[];v.innerHTML=cfg.coupons.map((x,i)=>{const id=x.id||'c'+i;return `<div class="cp ${used.includes(id)?'used':''}"><div class="e">${esc(x.emoji||'🎟')}</div><div style="flex:1"><b>${esc(x.title)}</b><p>${esc(x.text||'')}</p></div>${used.includes(id)?'':`<button class="btn" data-id="${esc(id)}">Использовать</button>`}</div>`}).join('');
  v.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{if(confirm('Использовать этот купон? Потом его не вернуть 😉')){const u=ls.get('ow_used')||[];u.push(b.dataset.id);ls.set('ow_used',u);track('coupon',null,b.closest('.cp').querySelector('b').textContent);hearts(20);show('coupons')}})},
 todo(v){const loc=ls.get('ow_todo')||[];const dn=cfg.checklist.filter((x,i)=>x.done||loc.includes(x.id||'t'+i)).length;
  v.innerHTML=`<div style="text-align:center;font-size:22px;margin-top:10px">Сделано ${dn} из ${cfg.checklist.length}</div><div class="prog"><i style="width:${Math.round(dn/cfg.checklist.length*100)}%"></i></div>`+cfg.checklist.map((x,i)=>{const id=x.id||'t'+i;const d=x.done||loc.includes(id);return `<div class="todo ${d?'done':''}" data-id="${esc(id)}" data-a="${x.done?1:0}"><u>${d?'✓':''}</u><span>${esc(x.text)}</span></div>`}).join('');
  v.querySelectorAll('.todo').forEach(t=>t.onclick=()=>{if(t.dataset.a==='1')return;const l=ls.get('ow_todo')||[],k=t.dataset.id,p=l.indexOf(k);p<0?l.push(k):l.splice(p,1);ls.set('ow_todo',l);track('todo',null,t.querySelector('span').textContent+(p<0?' ✓':' ✗'));show('todo')})},
 album(v){v.innerHTML='<div class="alb">'+cfg.gallery.map(x=>`<figure><img src="${esc(x.photo)}" data-lb data-cap="${esc(x.caption||'')}" loading="lazy" alt="">${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`).join('')+'</div>'},
 quiz(v){const Q=cfg.quiz;let i=0,sc=0;const step=()=>{
   if(i>=Q.length){if(!Q.done){Q.done=1;track('quiz',null,sc+'/'+Q.length)}v.innerHTML=`<div class="qz"><div style="font-size:54px">🏆</div><h2>Правильно: ${sc} из ${Q.length}</h2><p style="font-size:23px">${esc(cfg.quizEnd||'Ты у меня самая лучшая 💗')}</p><button class="btn" id="qr">Ещё раз</button></div>`;$('qr').onclick=()=>{i=0;sc=0;step()};if(sc===Q.length)hearts(40);return}
   const q=Q[i];v.innerHTML=`<div class="qz"><small>Вопрос ${i+1} из ${Q.length}</small><h2>${esc(q.q)}</h2>${(q.options||[]).map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
   v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,c=(+q.answer||1)-1;v.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===c)x.classList.add('ok')});if(k===c)sc++;else b.classList.add('no');setTimeout(()=>{i++;step()},1100)})};step()},
 music(v){v.innerHTML=cfg.playlist.map((x,i)=>{const e=ymEmbed(x.url);return `<div class="song"><span style="font-size:28px">🎵</span><div><b>${esc(x.title)}</b><small>${esc(x.artist||'')}</small></div>${e?`<button class="btn" data-i="${i}">▶ Слушать</button>`:(x.url?`<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Слушать</a>`:'')}</div><div class="plr" id="plr${i}"></div>`}).join('');
  v.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,box=$('plr'+i),e=ymEmbed(cfg.playlist[i].url);if(box.innerHTML){box.innerHTML='';b.textContent='▶ Слушать';return}
   box.innerHTML=`<iframe src="${esc(e.src)}" frameborder="0" allow="autoplay; encrypted-media" style="border:none;width:100%;height:${e.h}px;border-radius:12px" loading="lazy"></iframe>${e.open?`<a class="ya" href="${esc(e.open)}" target="_blank" rel="noopener">Открыть в Яндекс Музыке ↗</a>`:''}`;b.textContent='✕ Закрыть'})}
};

function holiday(){const now=new Date(),md=(now.getMonth()+1)+'-'+now.getDate(),key='ow_h_'+now.toDateString();if(ls.get(key))return;
 const L=cfg.holidays.filter(x=>x.date&&mdOf(x.date)===md).map(x=>({e:x.emoji||'🎉',t:x.title||'',x:x.text||''}));
 if(cfg.startDate&&mdOf(cfg.startDate)===md){const y=now.getFullYear()-new Date(cfg.startDate+'T00:00:00').getFullYear();if(y>=1)L.push({e:'💞',t:`Нам ${y} ${yw(y)}!`,x:'С годовщиной, моя любимая.'})}
 if(!L.length)return;const x=L[0];$('hE').textContent=x.e;$('hT').textContent=x.t;$('hX').textContent=x.x;$('hol').classList.add('on');hearts(80);$('hB').onclick=()=>{$('hol').classList.remove('on');ls.set(key,1)}}

function renderLetters(){const g=$('grid');if(!g)return;g.innerHTML='';const read=ls.get('ow_read')||[];
 letters.forEach(l=>{const sec=l.type==='secret',lk=isLocked(l),d=document.createElement('div');
  d.className='env'+(sec?' secret':'');d.style.cssText=`--c:${l.c||'#fbd3de'};--c2:${l.c2||'#f4b6c8'}`;
  const left=lk?Math.ceil((unlockAt(l)-new Date())/864e5):0;
  d.innerHTML=envInner(l)+(lk?`<div class="lock"><b>🔒</b>откроется ${ruDate(unlockAt(l))}<br>через ${left} ${plural(left)}</div>`:'')+((!lk&&!read.includes(l.id))?'<div class="badge">новое</div>':'');
  d.onclick=()=>{if(lk){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');return}open(l)};g.appendChild(d)})}
function envInner(l){return `<div class="eb"></div><div class="ef"></div><div class="stamp">♡</div><div class="seal">${esc(l.emoji)}</div><div class="lbl">${esc(l.title)}</div>`}

$('today').onclick=()=>{const ok=letters.filter(l=>l.type!=='secret'&&!isLocked(l));if(!ok.length)return;const d=new Date();const k=d.getFullYear()*372+d.getMonth()*31+d.getDate();open(ok[k%ok.length])};

function open(l){track('open',l);clearInterval(timer);const st=$('stage'),lt=$('letter');
 st.className='stage';st.innerHTML=`<div class="env ${l.type==='secret'?'secret':''}" style="--c:${l.c||'#fbd3de'};--c2:${l.c2||'#f4b6c8'}">${envInner(l)}</div>`;
 lt.className='letter';lt.innerHTML='';$('ov').classList.add('on');
 setTimeout(()=>st.classList.add('open'),800);
 setTimeout(()=>{build(l);lt.classList.add('on');st.classList.add('gone')},1500)}

function build(l){const lt=$('letter'),sec=l.type==='secret';lt.classList.toggle('secret',sec);lt.className=lt.className.replace(/\bwc-\S+/g,'').trim();if(l.bg&&!sec)lt.classList.add('wc-'+l.bg);
 const words=l.text.split(/(\s+)/).map(w=>/^\s+$/.test(w)||!w?w:`<span>${esc(w)}</span>`).join('');
 lt.innerHTML=`<h2>${esc(l.emoji)} ${esc(l.title)}</h2>${l.type==='hug'?'<div class="hug"><span class="l">🧍</span><span class="r">🧍</span><span class="h">💞</span></div>':''}<div class="scr" id="scr"><div class="txt" id="txt">${words}</div>${(l.photos&&l.photos.length)?`<div class="pics" id="pics">${l.photos.map((p,k)=>`<figure class="pol" style="--r:${k%2?2:-2}deg"><img src="${esc(p)}" alt="" loading="lazy"></figure>`).join('')}</div>`:''}${tracking()?FB:''}</div><div class="foot" id="foot" style="visibility:hidden">${l.audio?'<button class="btn ghost" id="au">▶ Послушать</button>':''}<button class="btn" id="cl">Закрыть письмо</button></div>`;
 const hg=lt.querySelector('.hug');hg&&setTimeout(()=>hg.classList.add('on'),400);
 if(l.audio){const a=new Audio(l.audio);$('au').onclick=()=>{a.paused?a.play():a.pause()};lt._a=a}
 $('cl').onclick=close;bindFb(l);
 const sp=[...lt.querySelectorAll('.txt span')];let i=0;
 const done=()=>{if(done.f)return;done.f=1;track('read',l);const fb=$('fb');fb&&(fb.style.display='block');clearInterval(timer);sp.forEach(s=>s.classList.add('on'));$('foot').style.visibility='visible';const pc=$('pics');pc&&pc.classList.add('on');const r=ls.get('ow_read')||[];if(!r.includes(l.id)){r.push(l.id);ls.set('ow_read',r)}if(sec)hearts(70)};
 timer=setInterval(()=>{if(i>=sp.length){done();return}sp[i].classList.add('on');const t=$('scr');t.scrollTop=t.scrollHeight;i++},hg?70:55);
 $('txt').onclick=done;lt.querySelectorAll('.pics img').forEach(im=>im.onclick=()=>{$('lbi').src=im.src;$('lbc').textContent='';$('lb').classList.add('on')})}

function close(){clearInterval(timer);const lt=$('letter');lt._a&&lt._a.pause();$('ov').classList.remove('on');lt.className='letter';lt.innerHTML='';renderLetters()}
function hearts(n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fall';s.textContent=['💖','💗','💕','💘','✨','🎉'][i%6];
 s.style.cssText=`left:${Math.random()*100}vw;font-size:${16+Math.random()*26}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*2.5}s`;
 document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}}
$('lb').onclick=()=>$('lb').classList.remove('on');
boot();
</script>
</body>
</html>
